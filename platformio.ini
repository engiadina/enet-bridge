; eNet / KNX-RF Bridge – ESP32 + CC1101
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32@6.12.0  ; Arduino-Kern 2.0.17 / ESP-IDF 4.4.7 – nicht ungeprüft auf 3.x (IDF 5) wechseln
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_filters = direct
lib_deps =
    bblanchon/ArduinoJson@^7.2.1
build_flags =
    -DCORE_DEBUG_LEVEL=0

; Seeed XIAO ESP32-C6: native USB (USB Serial/JTAG) als Serial. Arduino-Kern 3.x über pioarduino – der
; ESP32-Kern oben bleibt bewusst auf 2.x (laufende Bridges).
[env:xiao_esp32c6]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip  ; Arduino 3.3.11 (312 verlangt PlatformIO Core ≥ 6.2.0, 6.2.0.post1 gilt als kleiner)
board = seeed_xiao_esp32c6
framework = arduino
monitor_speed = 115200
monitor_filters = direct
lib_deps =
    bblanchon/ArduinoJson@^7.2.1
build_flags =
    -DCORE_DEBUG_LEVEL=0
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

; Host-Tests der Protokoll-Logik (Manchester, CRC, Rahmen): pio test -e native
[env:native]
platform = native
build_src_filter = -<*>
test_build_src = no
build_flags = -std=c++17 -Isrc
